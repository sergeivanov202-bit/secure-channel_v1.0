name: Build Windows EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-client:
    name: Сборка клиента
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller psutil pyopenssl cryptography loguru pyyaml
      - name: Сборка Client EXE
        run: |
          pyinstaller --clean --windowed --onefile --name "SecureChannel_Client" --hidden-import tkinter --hidden-import tkinter.ttk --hidden-import psutil --hidden-import OpenSSL --hidden-import cryptography --hidden-import _cffi_backend --noconfirm client_gui.py
      - name: Проверка
        run: |
          if (Test-Path "dist/SecureChannel_Client.exe") { echo "OK" } else { echo "FAIL"; exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: SecureChannel_Client
          path: dist/SecureChannel_Client.exe
          retention-days: 30

  build-server:
    name: Сборка сервера
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller psutil pyopenssl cryptography loguru pyyaml
      - name: Сборка Server EXE
        run: |
          pyinstaller --clean --windowed --onefile --name "SecureChannel_Server" --hidden-import tkinter --hidden-import tkinter.ttk --hidden-import psutil --hidden-import OpenSSL --hidden-import cryptography --hidden-import _cffi_backend --noconfirm server_gui.py
      - name: Проверка
        run: |
          if (Test-Path "dist/SecureChannel_Server.exe") { echo "OK" } else { echo "FAIL"; exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: SecureChannel_Server
          path: dist/SecureChannel_Server.exe
          retention-days: 30
