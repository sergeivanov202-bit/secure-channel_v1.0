name: Build Windows EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-client:
    name: Сборка клиента
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller psutil pyopenssl cryptography loguru pyyaml
      
      - name: Проверка файлов
        run: |
          echo "=== Файлы в репозитории ==="
          ls -la
          echo "=== Проверка client_gui.py ==="
          if (Test-Path "client_gui.py") { echo "OK: client_gui.py найден" } else { echo "ERROR: client_gui.py НЕ НАЙДЕН!" }
          echo "=== Проверка common.py ==="
          if (Test-Path "common.py") { echo "OK: common.py найден" } else { echo "ERROR: common.py НЕ НАЙДЕН!" }
      
      - name: Сборка Client EXE
        run: |
          pyinstaller --clean --windowed --onefile --name "SecureChannel_Client" --hidden-import psutil --hidden-import OpenSSL --hidden-import cryptography --hidden-import _cffi_backend --add-data "assets;assets" --noconfirm client_gui.py
      
      - name: Проверка результата
        run: |
          if (Test-Path "dist/SecureChannel_Client.exe") {
            echo "SUCCESS: Клиент собран"
          } else {
            echo "FAIL: Файл не создан"
            exit 1
          }
      
      - uses: actions/upload-artifact@v4
        with:
          name: SecureChannel_Client
          path: dist/SecureChannel_Client.exe
          retention-days: 30

  build-server:
    name: Сборка сервера
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller psutil pyopenssl cryptography loguru pyyaml
      
      - name: Проверка файлов
        run: |
          if (Test-Path "server_gui.py") { echo "OK" } else { echo "ERROR: server_gui.py не найден!"; exit 1 }
          if (Test-Path "common.py") { echo "OK" } else { echo "ERROR: common.py не найден!"; exit 1 }
      
      - name: Сборка Server EXE
        run: |
          pyinstaller --clean --windowed --onefile --name "SecureChannel_Server" --hidden-import psutil --hidden-import OpenSSL --hidden-import cryptography --hidden-import _cffi_backend --add-data "assets;assets" --noconfirm server_gui.py
      
      - name: Проверка результата
        run: |
          if (Test-Path "dist/SecureChannel_Server.exe") { echo "SUCCESS" } else { echo "FAIL"; exit 1 }
      
      - uses: actions/upload-artifact@v4
        with:
          name: SecureChannel_Server
          path: dist/SecureChannel_Server.exe
          retention-days: 30
